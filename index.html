<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

</section>
<div id="app" class="app" hidden>
<nav class="nav" aria-label="منو">
<b class="logo">Y</b>
<button data-r="home" title="خانه"><i class="bi bi-house-door"></i></button>

<button data-r="bm" title="ذخیره‌شده‌ها"><i class="bi bi-bookmark"></i></button>
<button data-r="profile" title="پروفایل"><i class="bi bi-person"></i></button>
<a id="adm" href="admin.html" title="پنل ادمین" hidden><i class="bi bi-shield-check" style="color:var(--or)"></i></a>

<main><header id="title" class="top"></header><div id="view"></div></main>
</div>
